name: Publish student template

on:
  push:
    branches: [students]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-assignment15-student-template
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'PGE323M/assignment15-solution' && github.ref == 'refs/heads/students'
    runs-on: ubuntu-latest
    steps:
      - name: Check out sanitized student branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify sanitized branch
        run: |
          test "$(git rev-list --count HEAD)" -eq 1
          test "$(git show -s --format=%P HEAD)" = ""
          test ! -e private_test.py
          test ! -e assignment15.ipynb
          for path in assignment15.py assignment13.py test.py test_submission.py submission-policy.json inputs.yml images/grid.png README.md AGENTS.md .github/skills/submit-assignment/SKILL.md .github/skills/submit-assignment/scripts/submit.py; do
            test -f "$path"
          done
          test "$(grep -c 'raise NotImplementedError' assignment15.py)" -eq 3
          ! grep --fixed-strings 'resistance = (width[i]' assignment15.py
          ! grep --fixed-strings 'volume = self.delta_x[i]' assignment15.py
          ! grep --fixed-strings 'matrix[i, j] -= t' assignment15.py
          grep --fixed-strings 'def boundary_transmissibility' assignment15.py
          ! grep --fixed-strings 'raise NotImplementedError' assignment13.py

      - name: Push sanitized tree to public template
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H github.com > "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          git remote set-url origin git@github.com:PGE323M/assignment15.git
          git branch -M master
          git push --force origin master
